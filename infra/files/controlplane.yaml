variant: flatcar
version: 1.1.0
kernel_arguments:
  should_exist:
    - "console=ttyAMA0,115200n8"
    - "console=tty1"
    - "flatcar.autologin"
    - "usbcore.autosuspend=-1"
passwd:
  users:
    - name: core
      ssh_authorized_keys: "$HOST_PUBLIC_KEY"
storage:
  files:
    - path: /opt/extensions/k3s/k3s-v1.32.3+k3s1-arm64.raw
      mode: 0644
      contents:
        source: https://extensions.flatcar.org/extensions/k3s-v1.32.3+k3s1-arm64.raw
    - path: /etc/sysupdate.k3s-v1.32.d/k3s-v1.32.conf
      contents:
        source: https://extensions.flatcar.org/extensions/k3s/k3s-v1.32.conf
    - path: /etc/sysupdate.d/noop.conf
      contents:
        source: https://extensions.flatcar.org/extensions/noop.conf
    - path: /etc/systemd/system/multi-user.target.wants/k3s.service
      target: /usr/local/lib/systemd/system/k3s.service
      overwrite: true
    - path: /etc/rancher/k3s/config.yaml
      contents:
        inline: |
          write-kubeconfig-mode: "0644"
          token: "$K3S_TOKEN"
          bind-address: "$KUBEAPI_IP"
  links:
    - target: /opt/extensions/k3s/k3s-v1.32.3+k3s1-arm64.raw
      path: /etc/extensions/k3s.raw
      hard: false
    - path: /etc/extensions/docker-flatcar.raw
      target: /dev/null
      overwrite: true
    - path: /etc/extensions/containerd-flatcar.raw
      target: /dev/null
      overwrite: true
systemd:
  units:
    - name: systemd-sysupdate.timer
      enabled: true # Enables automated updates within the same minor release
    - name: systemd-sysupdate.service
      dropins:
        - name: k3s.conf
          contents: |
            [Service]
            ExecStartPre=/usr/bin/sh -c "readlink --canonicalize /etc/extensions/k3s.raw > /tmp/k3s"
            ExecStartPre=/usr/lib/systemd/systemd-sysupdate -C k3s-v1.32 update
            ExecStartPost=/usr/bin/sh -c "readlink --canonicalize /etc/extensions/k3s.raw > /tmp/k3s-new"
            ExecStartPost=/usr/bin/sh -c "if ! cmp --silent /tmp/k3s /tmp/k3s-new; then touch /run/reboot-required; fi"
